<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>航班恢复控制台</title>
<style>
body{font:15px system-ui;max-width:1180px;margin:40px auto;background:#eef2f7;color:#182230;padding:0 20px}
section{background:white;padding:20px;border-radius:12px;margin:16px 0;box-shadow:0 2px 10px #0001}
pre{background:#111827;color:#93c5fd;padding:15px;overflow:auto;border-radius:8px}
input,button,select{font:inherit;padding:8px;margin:4px}
button{background:#0f766e;color:white;border:0;border-radius:6px;cursor:pointer}
button:disabled{background:#9ca3af;cursor:not-allowed}
.plan{border:1px solid #d0d7e2;border-radius:10px;padding:14px;margin:12px 0}
.plan h3{margin:0 0 8px}
.badges span{display:inline-block;background:#e5e7eb;border-radius:20px;padding:3px 12px;margin:2px 6px 2px 0;font-size:13px}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:13px}
th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:left}
th{background:#f1f5f9}
.s-pending{color:#b45309;font-weight:600}.s-notified{color:#1d4ed8;font-weight:600}
.s-executing{color:#0e7490;font-weight:600}.s-completed{color:#15803d;font-weight:600}
.s-canceled{color:#b91c1c;font-weight:600}
.muted{color:#64748b;font-size:12px}.err{color:#b91c1c}
</style>
<h1>航班恢复控制台</h1>
<p>写操作使用 JSON API 并携带 X-User-Id、X-Role。锁定方案后逐项登记机组通知，通知成功后才能执行或取消。</p>
<section>
  身份 <input id="u" value="sched" size="8">
  <select id="r"><option value="scheduler">scheduler</option><option value="ops_manager">ops_manager</option><option value="auditor">auditor</option><option value="viewer">viewer</option></select>
  <button onclick="load()">刷新</button><span id="msg"></span>
</section>
<div id="plans"></div>
<section><h3>航班状态</h3><div id="flights"></div></section>
<script>
const LABELS={pending:"待通知",notified:"已通知",executing:"执行中",completed:"已完成",canceled:"已取消"};
function headers(){return {'X-User-Id':u.value,'X-Role':r.value,'Content-Type':'application/json'}}
async function api(url,method='GET',body){
  let x=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined});
  let data=await x.json(); if(!x.ok)throw new Error(data.message||data.error||('HTTP '+x.status)); return data;
}
async function act(url,body,btn){
  msg.textContent="";let old=btn.textContent;btn.disabled=true;btn.textContent="处理中…";
  try{await api(url,'POST',body);await load();}catch(e){msg.innerHTML='<span class="err">'+e.message+'</span>';btn.disabled=false;btn.textContent=old;}
}
function notifyBtn(it){return `<button onclick="doNotify(${it.id},this)">登记通知</button>`}
function doNotify(id,btn){
  let detail=prompt("通知说明（可选）","")||"";
  act(`/api/execution-items/${id}/notify`,{notify_result:'notified',notify_detail:detail},btn);
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function planCard(p){
  let s=p.execution_summary,c=s.counts,pa=s.passengers_by_status;
  let badges=`<span>待通知 ${c.pending}</span><span>已通知 ${c.notified}</span><span>执行中 ${c.executing}</span><span>已完成 ${c.completed}</span><span class="s-canceled">已取消 ${c.canceled}</span><span>受影响旅客 ${s.affected_passengers}</span>`;
  let rows=p.execution_items.map(it=>{
    let ops="";
    if(it.status==='pending')ops=notifyBtn(it);
    else if(it.status==='notified')ops=`<button onclick="act('/api/execution-items/${it.id}/execute',{},this)">开始执行</button>
      <button onclick="doCancel(${it.id},this)">取消</button>`;
    else if(it.status==='executing')ops=`<button onclick="act('/api/execution-items/${it.id}/complete',{},this)">登记完成</button>
      <button onclick="doCancel(${it.id},this)">临时取消</button>`;
    else if(it.status==='canceled')ops=`<span class="muted">${esc(it.canceled_by)}: ${esc(it.cancel_reason)}</span>`;
    else ops='<span class="muted">—</span>';
    return `<tr><td>${esc(it.flight_no)}</td><td>${esc(it.origin)}→${esc(it.destination)}</td><td>${esc(it.aircraft_id)} / ${esc(it.crew_id)}</td>
      <td>${esc(it.new_std)}</td><td>${it.passenger_count}</td>
      <td class="s-${it.status}">${LABELS[it.status]}</td>
      <td>${it.notify_result?esc(it.notify_result)+(it.notify_detail?' ('+esc(it.notify_detail)+')':'')+'<div class="muted">'+esc(it.notified_by)+' @ '+esc(it.notified_at)+'</div>':'<span class="muted">未通知</span>'}</td>
      <td>${ops}</td></tr>`;
  }).join("");
  return `<div class="plan"><h3>方案 #${p.id} ${esc(p.name)} <span class="muted">[${p.status}]</span></h3>
    <div class="badges">${badges}</div>
    <table><tr><th>航班</th><th>航线</th><th>飞机/机组</th><th>新时刻</th><th>旅客</th><th>状态</th><th>通知登记</th><th>操作</th></tr>${rows}</table></div>`;
}
function doCancel(id,btn){
  let reason=prompt("取消原因（必填）：","");if(reason===null)return;
  reason=reason.trim();if(!reason){alert("必须填写取消原因");return;}
  act(`/api/execution-items/${id}/cancel`,{reason},btn);
}
async function load(){
  msg.textContent="";
  try{
    let st=await api('/api/state');
    plans.innerHTML=st.plans.filter(p=>p.status==='locked').map(planCard).join("")||'<section>暂无锁定方案</section>';
    flights.innerHTML='<table><tr><th>航班</th><th>航线</th><th>时刻</th><th>飞机/机组</th><th>旅客</th><th>状态</th><th>取消原因</th></tr>'+
      st.flights.map(f=>`<tr><td>${esc(f.flight_no)}</td><td>${esc(f.origin)}→${esc(f.destination)}</td><td>${esc(f.std)}</td>
      <td>${esc(f.aircraft_id)} / ${esc(f.crew_id)}</td><td>${f.passenger_count}</td><td>${esc(f.status)}</td><td>${esc(f.cancel_reason||'')}</td></tr>`).join("")+'</table>';
  }catch(e){msg.innerHTML='<span class="err">'+e.message+'</span>';}
}
load();
</script>
